<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Solid Minimalist Background -->
  <rect width="1080" height="1920" fill="#11110f"/>

  <!-- Architectural Frame -->
  <rect x="60" y="60" width="960" height="1800" fill="none" stroke="#2e2b26" stroke-width="1.5"/>
  <rect x="68" y="68" width="944" height="1784" fill="none" stroke="#2e2b26" stroke-width="0.5" opacity="0.6"/>

  <!-- Top Metadata Bar -->
  <text x="120" y="160" class="mono" font-size="16" font-weight="700" letter-spacing="3" fill="#c84132">INFINIAI · SERVICE SPECIFICATION</text>
  <text x="960" y="160" text-anchor="end" class="mono" font-size="20" font-weight="700" letter-spacing="2" fill="#9a9488">01 / 20</text>
  <line x1="120" y1="200" x2="960" y2="200" stroke="#2e2b26" stroke-width="1.5"/>

  <!-- Service Badge -->
  <rect x="120" y="250" width="420" height="46" rx="4" fill="#23211d"/>
  <text x="140" y="280" class="mono" font-size="14" font-weight="700" letter-spacing="1.5" fill="#faf8f2">TEXT INTELLIGENCE · REWRITE &amp; ADAPT</text>

  <!-- One Full Sentence Headline -->
  <text class="sans" font-size="52" font-weight="800" fill="#faf8f2">
    <tspan x="120" y="520">We rewrite draft service</tspan><tspan x="120" y="592">proposals before you send</tspan><tspan x="120" y="664">them to prospective clients.</tspan>
  </text>

  <!-- Terracotta Hairline -->
  <line x1="120" y1="761" x2="340" y2="761" stroke="#c84132" stroke-width="3.5"/>

  <!-- Flat Declarative Body -->
  <text class="sans" font-size="26" font-weight="400" fill="#9a9488">
    <tspan x="120" y="821">Unformatted proposal drafts lose contracts</tspan><tspan x="120" y="867">when pricing tables wrap across page breaks</tspan><tspan x="120" y="913">and scope sections read like internal notes.</tspan><tspan x="120" y="959">We standardize headings, clean up the</tspan><tspan x="120" y="1005">preventive maintenance matrix, and deliver a</tspan><tspan x="120" y="1051">client-ready Word document and print-locked</tspan><tspan x="120" y="1097">PDF within 24 hours.</tspan>
  </text>

  <!-- Concrete Specifications Panel -->
  <g transform="translate(120, 1223)">
    <rect x="0" y="0" width="840" height="230" rx="6" fill="#191815" stroke="#2e2b26" stroke-width="1.5"/>

    <text x="45" y="60" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#9a9488">TURNAROUND</text>
    <text x="45" y="105" class="sans" font-size="30" font-weight="700" fill="#faf8f2">24 hours</text>

    <line x1="280" y1="35" x2="280" y2="195" stroke="#2e2b26" stroke-width="1"/>

    <text x="325" y="60" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#9a9488">DELIVERABLE</text>
    <text x="325" y="105" class="sans" font-size="30" font-weight="700" fill="#faf8f2">.docx and .pdf</text>

    <line x1="570" y1="35" x2="570" y2="195" stroke="#2e2b26" stroke-width="1"/>

    <text x="615" y="60" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#9a9488">BASE PRICING</text>
    <text x="615" y="105" class="sans" font-size="30" font-weight="700" fill="#c84132">From USD 50</text>

    <line x1="45" y1="145" x2="795" y2="145" stroke="#2e2b26" stroke-width="0.8" stroke-dasharray="4 4"/>
    <text x="45" y="188" class="mono" font-size="15" fill="#9a9488">Catalog code: text-rewrite</text>
  </g>

  <!-- Required Contact Bar Leading to /consultation/ -->
  <g transform="translate(120, 1530)">
    <rect x="0" y="0" width="840" height="150" rx="6" fill="#23211d" stroke="#2e2b26" stroke-width="1.5"/>
    <circle cx="50" cy="75" r="9" fill="#c84132"/>
    <text x="80" y="65" class="mono" font-size="13" letter-spacing="2" font-weight="700" fill="#9a9488">DIRECT INTAKE &amp; SCOPING</text>
    <text x="80" y="108" class="sans" font-size="23" font-weight="700" fill="#faf8f2">Contact us via www.byinfini.online/consultation/</text>
  </g>

  <!-- Bottom Brand Rules -->
  <line x1="120" y1="1750" x2="960" y2="1750" stroke="#2e2b26" stroke-width="1"/>
  <text x="120" y="1800" class="mono" font-size="14" letter-spacing="2" fill="#9a9488">WWW.BYINFINI.ONLINE</text>
  <text x="960" y="1800" text-anchor="end" class="mono" font-size="14" letter-spacing="2" fill="#9a9488">INTERNAL DESK &amp; CHAT BILLED DIRECTLY</text>
</svg>