{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign out - InfiniAI</title>
  <link rel="stylesheet" href="{% static 'css/platform.css' %}">
</head>
<body>
<main class="auth-page">
  <section class="auth-story">
    <div>
      <div class="eyebrow" style="color:#e46b5d">InfiniAI</div>
      <h1 class="display" style="font-size:clamp(3.5rem,7vw,7rem);max-width:8ch">Leaving the workspace?</h1>
      <p>Your projects, payments, messages and saved rewrites remain attached to your account.</p>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-box">
      <div class="eyebrow">Account</div>
      <h1>Sign out</h1>
      <p class="auth-panel-copy">End this session on this device?</p>
      <form method="post" action="{% url 'account_logout' %}" class="form-stack">
        {% csrf_token %}
        <button class="btn btn-primary" type="submit">Sign out</button>
        <a class="btn" href="{% url 'platformhub:workspace' %}">Return to workspace</a>
      </form>
      <p class="auth-legal"><a href="{% url 'platformhub:privacy' %}">Privacy</a> · <a href="{% url 'platformhub:terms' %}">Terms</a></p>
    </div>
  </section>
</main>
</body>
</html>
