
{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — InfiniAI</title><link rel="stylesheet" href="{% static 'css/platform.css' %}"></head>
<body><main class="auth-page">
<section class="auth-story"><div><div class="eyebrow" style="color:#e46b5d">InfiniAI</div><h1 class="display" style="font-size:clamp(3.5rem,7vw,7rem);max-width:8ch">Get access back.</h1><p>A reset link will be sent to the account email.</p></div></section>
<section class="auth-panel"><div class="auth-box"><div class="eyebrow">Account recovery</div><h1>Reset password.</h1>
<form method="post" action="{% url 'account_reset_password' %}" class="form-stack">{% csrf_token %}
<div class="field"><label for="id_email">Email</label><input id="id_email" type="email" name="email" required autocomplete="email"></div><button class="btn btn-primary" type="submit">Send reset link</button></form>
<div class="auth-links"><a href="{% url 'account_login' %}">Back to sign in</a></div></div></section></main></body></html>
