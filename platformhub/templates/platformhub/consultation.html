{% extends "base.html" %}
{% block title %}Talk to us — InfiniAI{% endblock %}
{% block description %}Contact InfiniAI.{% endblock %}

{% block content %}
<div class="page-shell contact-head contact-head-clean">
  <div class="eyebrow">Talk to us</div>
  <h1 class="h1">Talk to us</h1>
</div>

<section class="section contact-flow-section">
  <div class="shell contact-flow-shell" id="contact-flow-root">
    {% include "platformhub/partials/consultation_flow.html" %}
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  const root = document.getElementById("contact-flow-root");
  if (!root) return;

  function focusFirst() {
    const input = root.querySelector("input[autofocus], textarea[autofocus]");
    if (input) window.setTimeout(function () { input.focus(); }, 20);
  }

  root.addEventListener("submit", async function (event) {
    const form = event.target.closest("[data-contact-form]");
    if (!form) return;

    event.preventDefault();

    const button = form.querySelector('button[type="submit"]');
    const original = button ? button.textContent : "";
    if (button) {
      button.disabled = true;
      button.textContent = "…";
    }

    try {
      const response = await fetch(form.action || window.location.href, {
        method: "POST",
        body: new FormData(form),
        headers: {
          "X-Requested-With": "XMLHttpRequest",
          "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]").value
        }
      });
      const data = await response.json();
      if (!response.ok || !data.html) throw new Error("Request failed");
      root.innerHTML = data.html;
      focusFirst();
    } catch (error) {
      if (button) {
        button.disabled = false;
        button.textContent = original;
      }
      let feedback = root.querySelector(".contact-feedback");
      if (!feedback) {
        feedback = document.createElement("div");
        feedback.className = "contact-feedback is-error";
        root.prepend(feedback);
      }
      feedback.textContent = "Try again.";
    }
  });

  focusFirst();
})();
</script>
{% endblock %}
