name: Humanizer Runtime

on:
  push:
    branches:
      - runtime/openrouter-sentence-rewrite-20260921
      - platform/infiniai-rebuild-20260920
  pull_request:
    paths:
      - "humanizer/**"
      - "core/settings.py"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      OFFLINE_MODE: "True"
      DJANGO_SECRET_KEY: ci-secret
      OPENROUTER_API_KEY: test-key-not-used
      HUMANIZER_BACKEND: openrouter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test humanizer
