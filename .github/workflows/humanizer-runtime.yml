name: Humanizer Runtime

on:
  push:
    branches:
      - "runtime/**"
      - platform/infiniai-rebuild-20260920
  pull_request:
    paths:
      - "humanizer/**"
      - "core/settings.py"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      OFFLINE_MODE: "True"
      DJANGO_SECRET_KEY: ci-secret
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HUMANIZER_BACKEND: openrouter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test humanizer
      - name: Live OpenRouter strength-8 smoke
        if: env.OPENROUTER_API_KEY != ''
        env:
          HUMANIZER_MODEL_ID: mistralai/ministral-3b-2512
          HUMANIZER_DEFAULT_STRENGTH: "8"
          HUMANIZER_SENTENCE_BATCH_SIZE: "8"
          HUMANIZER_MAX_CONCURRENCY: "6"
          HUMANIZER_REQUEST_TIMEOUT: "30"
          HUMANIZER_MAX_RETRIES: "2"
          HUMANIZER_PROVIDER_SORT: throughput
        run: |
          python - <<'PY'
          import os, time, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings")
          django.setup()

          from difflib import SequenceMatcher
          from humanizer.service import rewrite_text
          from humanizer.sentence_runtime import split_sentences

          samples = [
              (
                  "short",
                  "Treated wastewater can reduce pressure on rivers and aquifers during drought. "
                  "Cities can reuse it for irrigation, industrial processes, groundwater recharge, or drinking water after suitable treatment. "
                  "Treatment requirements should match the intended use because unnecessary treatment consumes energy and money. "
                  "Public trust depends on clear monitoring, reliable operation, and transparent responsibility."
              ),
              (
                  "medium",
                  "Urban water systems face growing pressure as droughts become longer and demand rises. "
                  "Water reuse can provide a local source that remains available even when rainfall is low. "
                  "Engineers select treatment processes according to how the recovered water will be used. "
                  "Irrigation generally requires a different treatment standard from drinking water. "
                  "Separate distribution networks can keep non-potable recycled water away from drinking-water pipes. "
                  "Potable reuse requires several treatment barriers and continuous monitoring. "
                  "Energy use must be compared with alternatives such as desalination, long-distance transfers, and deep groundwater pumping. "
                  "Public concerns should be addressed before construction because design and governance choices affect trust. "
                  "Monitoring results should be published in a form that residents can understand. "
                  "Reuse can reduce wastewater discharges, although removing too much flow may affect downstream ecosystems. "
                  "Cities therefore need to consider the wider basin when deciding how much water to recycle. "
                  "A diversified supply portfolio can make urban water systems more resilient during prolonged shortages."
              ),
          ]

          for name, source in samples:
              started = time.perf_counter()
              output, model = rewrite_text(source, strength=8)
              elapsed = time.perf_counter() - started
              src_sentences = len(split_sentences(source)[0])
              out_sentences = len(split_sentences(output)[0])
              similarity = SequenceMatcher(None, source.lower(), output.lower()).ratio()
              print(f"=== {name.upper()} ===")
              print(f"model={model}")
              print(f"strength=8")
              print(f"elapsed_seconds={elapsed:.3f}")
              print(f"source_sentences={src_sentences}")
              print(f"output_sentences={out_sentences}")
              print(f"sequence_similarity={similarity:.3f}")
              print(f"em_dash_count={output.count('—')}")
              print("OUTPUT:")
              print(output)
              print()
          PY

# live-smoke push trigger
