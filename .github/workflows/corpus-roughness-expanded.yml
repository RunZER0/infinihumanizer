name: Expanded Corpus Roughness Benchmark
on:
  push:
    branches:
      - benchmark/corpus-roughness-expanded-20260921
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run expanded corpus benchmark
        run: python .github/scripts/corpus_roughness_expanded.py
