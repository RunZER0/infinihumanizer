name: Reference Strength-8 Paired Benchmark
on:
  push:
    branches:
      - benchmark/reference-strength8-paired-20260921
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run paired benchmark against production
        run: python .github/scripts/reference_strength8_paired.py
